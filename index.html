<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公關新聞收錄系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 font-sans text-gray-800">

    <div class="max-w-7xl mx-auto space-y-4">
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            
            <div class="md:col-span-1 space-y-4">
                <div class="bg-indigo-600 text-white p-4 rounded-xl shadow border border-indigo-700">
                    <h1 class="text-lg font-bold mb-2">公關新聞收錄管理系統</h1>
                    <label class="block text-xs font-medium text-indigo-200 mb-1">當前活動主題</label>
                    <input type="text" id="eventTheme" oninput="saveTheme()" placeholder="請輸入活動主題..." class="w-full p-2 border border-indigo-400 bg-indigo-700 text-white placeholder-indigo-300 text-sm rounded-md focus:ring-2 focus:ring-white focus:outline-none">
                </div>

                <div class="bg-white p-4 rounded-xl shadow border border-gray-200 space-y-3">
                    <h3 class="text-sm font-semibold text-gray-700 pb-1 border-b">收錄則數統計</h3>
                    <div class="space-y-1.5 text-xs text-gray-600">
                        <div class="flex justify-between"><span>報紙：</span><span id="count-newspaper" class="font-bold text-indigo-600">0</span></div>
                        <div class="flex justify-between"><span>影音：</span><span id="count-video" class="font-bold text-indigo-600">0</span></div>
                        <div class="flex justify-between"><span>網路：</span><span id="count-web" class="font-bold text-indigo-600">0</span></div>
                        <div class="flex justify-between"><span>雜誌：</span><span id="count-magazine" class="font-bold text-indigo-600">0</span></div>
                        <hr class="my-1.5">
                        <div class="flex justify-between text-sm font-bold text-gray-800"><span>總共：</span><span id="count-total">0</span></div>
                    </div>
                    
                    <hr class="my-2">
                    
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="exportProject()" class="bg-blue-50 hover:bg-blue-100 text-blue-700 py-1.5 px-2 text-xs font-medium rounded-md border border-blue-200 transition text-center">
                            📤 匯出專案
                        </button>
                        <button onclick="document.getElementById('importProjectFile').click()" class="bg-amber-50 hover:bg-amber-100 text-amber-700 py-1.5 px-2 text-xs font-medium rounded-md border border-amber-200 transition text-center">
                            📥 匯入專案
                        </button>
                        <input type="file" id="importProjectFile" class="hidden" accept=".json" onchange="importProject(event)">
                    </div>
                    <button onclick="clearDatabase()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 py-1 px-2 text-xs font-medium rounded-md transition text-center">
                        🗑️ 清空所有資料
                    </button>
                </div>
            </div>

            <div class="md:col-span-3 space-y-4">
                <div class="bg-white p-4 rounded-xl shadow border border-gray-200">
                    <h3 class="text-sm font-semibold text-gray-700 mb-3">新增報導資訊</h3>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">收錄日期</label>
                            <input type="date" id="newsDate" class="w-full p-1.5 border border-gray-300 rounded-md text-xs">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">報導類型</label>
                            <select id="newsType" class="w-full p-1.5 border border-gray-300 rounded-md text-xs">
                                <option value="網路">網路</option>
                                <option value="報紙">報紙</option>
                                <option value="影音">影音</option>
                                <option value="雜誌">雜誌</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-medium text-gray-400 mb-1">媒體名稱</label>
                            <input type="text" id="mediaName" placeholder="例如：中央社" class="w-full p-1.5 border border-gray-300 rounded-md text-xs">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-2">
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">報導標題</label>
                            <input type="text" id="newsTitle" placeholder="請輸入新聞標題" class="w-full p-1.5 border border-gray-300 rounded-md text-xs">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">報導網址或報紙版位</label>
                            <input type="text" id="newsLink" placeholder="https://... 或 A3版" class="w-full p-1.5 border border-gray-300 rounded-md text-xs">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-2 items-end">
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">記者名字</label>
                            <input type="text" id="reporter" placeholder="陳大文（選填）" class="w-full p-1.5 border border-gray-300 rounded-md text-xs">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">關鍵字（用逗號隔開）</label>
                            <input type="text" id="keywords" placeholder="如：新產品, 淨零碳排" class="w-full p-1.5 border border-gray-300 rounded-md text-xs">
                        </div>
                        <div>
                            <button onclick="importNews()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded-md font-medium text-xs shadow transition">
                                ➕ 匯入資料
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow border border-gray-200 overflow-hidden">
                    <div class="p-3 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                        <h3 class="text-sm font-semibold text-gray-700">新聞資料庫 (DATA BASE)</h3>
                        <div class="flex space-x-2 text-xs">
                            <button onclick="exportCSV()" class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded hover:bg-emerald-100 transition">
                                📊 匯出 Excel (CSV)
                            </button>
                            <button onclick="document.getElementById('importCSVFile').click()" class="bg-teal-50 text-teal-700 border border-teal-200 px-2.5 py-1 rounded hover:bg-teal-100 transition">
                                📊 匯入 Excel (CSV)
                            </button>
                            <input type="file" id="importCSVFile" class="hidden" accept=".csv" onchange="importCSV(event)">
                        </div>
                    </div>
                    <div class="overflow-x-auto max-h-72">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead class="sticky top-0 bg-gray-100 shadow-sm z-10">
                                <tr class="text-gray-500 font-medium border-b border-gray-200">
                                    <th class="p-2.5 w-12 text-center">編號</th>
                                    <th class="p-2.5 w-24">收錄日期</th>
                                    <th class="p-2.5 w-16">類型</th>
                                    <th class="p-2.5 w-24">媒體名稱</th>
                                    <th class="p-2.5">報導標題</th>
                                    <th class="p-2.5">連結/版位</th>
                                    <th class="p-2.5 w-16">記者</th>
                                    <th class="p-2.5 w-28">關鍵字</th>
                                </tr>
                            </thead>
                            <tbody id="databaseBody" class="divide-y divide-gray-100 text-gray-600">
                                </tbody>
                        </table>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-xl shadow border border-gray-200">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-sm font-semibold text-gray-700">第二步：篩選主管交辦資料與排序</h3>
                        <button onclick="toggleHistoryModal()" class="text-xs text-indigo-600 hover:underline">
                            📜 查看歷史匯出紀錄
                        </button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">起始序號</label>
                            <input type="number" id="startId" placeholder="1" class="w-full p-1.5 border border-gray-300 rounded-md text-xs">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">結束序號</label>
                            <input type="number" id="endId" placeholder="10" class="w-full p-1.5 border border-gray-300 rounded-md text-xs">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-1">關鍵字篩選（選填）</label>
                            <input type="text" id="filterKeyword" placeholder="輸入要篩選的關鍵字" class="w-full p-1.5 border border-gray-300 rounded-md text-xs">
                        </div>
                        <div>
                            <button onclick="filterAndOpenSortModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-2 rounded-md font-medium text-xs shadow transition">
                                🔍 篩選並進行排序
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="sortModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-4xl h-[85vh] rounded-xl shadow-2xl flex flex-col overflow-hidden animate-fade-in">
            <div class="bg-gray-100 p-4 border-b flex justify-between items-center">
                <div>
                    <h3 class="text-base font-bold text-gray-800">🖱️ 調整報導重要性排序（滑鼠上下拖曳即可排序）</h3>
                    <p class="text-xs text-gray-500">排在最上方的會是最優先的新聞內容</p>
                </div>
                <button onclick="closeSortModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold px-2">＆times;</button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 bg-gray-50">
                <ul id="sortableList" class="space-y-2">
                    </ul>
            </div>
            <div class="p-4 border-t bg-white flex justify-end space-x-3">
                <button onclick="closeSortModal()" class="px-4 py-2 text-xs font-medium text-gray-500 hover:text-gray-700">取消</button>
                <button onclick="saveSortAndExport()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-md font-medium text-xs shadow">
                    💾 儲存排序並匯出文字內容 (自動複製)
                </button>
            </div>
        </div>
    </div>

    <div id="historyModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-2xl max-h-[70vh] rounded-xl shadow-2xl flex flex-col overflow-hidden">
            <div class="bg-gray-100 p-3 border-b flex justify-between items-center">
                <h3 class="text-sm font-bold text-gray-800">📜 歷史匯出排序紀錄</h3>
                <button onclick="toggleHistoryModal()" class="text-gray-400 hover:text-gray-600 font-bold">＆times;</button>
            </div>
            <div class="flex-1 overflow-y-auto p-3 text-xs space-y-3" id="historyContainer">
                </div>
        </div>
    </div>

    <script>
        let newsDatabase = JSON.parse(localStorage.getItem('prNewsDatabase')) || [];
        let exportHistory = JSON.parse(localStorage.getItem('prExportHistory')) || [];
        let currentId = newsDatabase.length > 0 ? Math.max(...newsDatabase.map(item => item.id)) + 1 : 1;
        let filteredNewsResult = []; // 當前正在排序的資料

        window.onload = function() {
            document.getElementById('eventTheme').value = localStorage.getItem('prEventTheme') || "";
            document.getElementById('newsDate').valueAsDate = new Date();
            renderDatabase();
            updateCounters();
        };

        function saveTheme() {
            localStorage.setItem('prEventTheme', document.getElementById('eventTheme').value);
        }

        // 匯入單筆新聞
        function importNews() {
            const date = document.getElementById('newsDate').value;
            const type = document.getElementById('newsType').value;
            const media = document.getElementById('mediaName').value.trim();
            const title = document.getElementById('newsTitle').value.trim();
            const link = document.getElementById('newsLink').value.trim();
            const reporter = document.getElementById('reporter').value.trim();
            const keywords = document.getElementById('keywords').value.trim();

            if (!date && !media && !title && !link && !reporter && !keywords) return;

            // 網址防呆優化：只有輸入包含 http 的網址時，才觸發重複檢查
            if (link.startsWith('http')) {
                const isDuplicate = newsDatabase.some(item => item.link === link);
                if (isDuplicate) {
                    alert(`【重複收錄警告】此網址（${link}）已經存在於資料庫中！`);
                    return;
                }
            }

            const newsItem = {
                id: currentId++,
                date: date || "未填",
                type: type,
                media: media || "未填",
                title: title || "未填",
                link: link || "未填",
                reporter: reporter || "未填",
                keywords: keywords || ""
            };

            newsDatabase.push(newsItem);
            saveToLocalStorage();
            renderDatabase();
            updateCounters();
            clearInputs();
        }

        function renderDatabase() {
            const tbody = document.getElementById('databaseBody');
            tbody.innerHTML = "";

            newsDatabase.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition border-b border-gray-100";
                
                let linkDisplay = item.link;
                if (item.link.startsWith('http')) {
                    linkDisplay = `<a href="${item.link}" target="_blank" class="text-blue-600 hover:underline break-all">${item.link}</a>`;
                }

                tr.innerHTML = `
                    <td class="p-2.5 text-center font-medium text-gray-400">${item.id}</td>
                    <td class="p-2.5 whitespace-nowrap">${item.date}</td>
                    <td class="p-2.5"><span class="px-1.5 py-0.5 rounded text-[10px] font-medium ${getTypeClass(item.type)}">${item.type}</span></td>
                    <td class="p-2.5 font-medium">${item.media}</td>
                    <td class="p-2.5 max-w-xs truncate" title="${item.title}">${item.title}</td>
                    <td class="p-2.5 max-w-xs text-[11px]">${linkDisplay}</td>
                    <td class="p-2.5">${item.reporter}</td>
                    <td class="p-2.5 text-[11px] text-gray-400">${item.keywords}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function getTypeClass(type) {
            switch(type) {
                case '報紙': return 'bg-orange-100 text-orange-800';
                case '影音': return 'bg-red-100 text-red-800';
                case '網路': return 'bg-blue-100 text-blue-800';
                case '雜誌': return 'bg-green-100 text-green-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        function updateCounters() {
            const counts = { '報紙': 0, '影音': 0, '網路': 0, '雜誌': 0 };
            newsDatabase.forEach(item => { if (counts[item.type] !== undefined) counts[item.type]++; });
            document.getElementById('count-newspaper').innerText = counts['報紙'];
            document.getElementById('count-video').innerText = counts['影音'];
            document.getElementById('count-web').innerText = counts['網路'];
            document.getElementById('count-magazine').innerText = counts['雜誌'];
            document.getElementById('count-total').innerText = newsDatabase.length;
        }

        function clearInputs() {
            document.getElementById('mediaName').value = "";
            document.getElementById('newsTitle').value = "";
            document.getElementById('newsLink').value = "";
            document.getElementById('reporter').value = "";
            document.getElementById('keywords').value = "";
        }

        function saveToLocalStorage() {
            localStorage.setItem('prNewsDatabase', JSON.stringify(newsDatabase));
            localStorage.setItem('prExportHistory', JSON.stringify(exportHistory));
        }

        function clearDatabase() {
            if (confirm("⚠️ 確定要清空所有資料嗎？")) {
                localStorage.clear();
                newsDatabase = []; exportHistory = []; currentId = 1;
                document.getElementById('eventTheme').value = "";
                renderDatabase(); updateCounters();
                alert("已完全清空！");
            }
        }

        // ================= 專案 匯出 / 匯入 (JSON) =================
        function exportProject() {
            const dataStr = JSON.stringify({ theme: document.getElementById('eventTheme').value, database: newsDatabase });
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `新聞收錄專案備份_${document.getElementById('eventTheme').value || '未命名'}.json`;
            a.click();
        }

        function importProject(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = JSON.parse(evt.target.result);
                    if (data.database) {
                        newsDatabase = data.database;
                        document.getElementById('eventTheme').value = data.theme || "";
                        currentId = newsDatabase.length > 0 ? Math.max(...newsDatabase.map(item => item.id)) + 1 : 1;
                        saveTheme(); saveToLocalStorage(); renderDatabase(); updateCounters();
                        alert("專案備份匯入成功！");
                    }
                } catch (err) { alert("無效的專案檔案！"); }
            };
            reader.readAsText(file);
        }

        // ================= Excel (CSV) 匯出 / 匯入 =================
        function exportCSV() {
            if (newsDatabase.length === 0) return alert("沒有資料可導出！");
            // 加上 \uFEFF 確保 Excel 打開不會亂碼
            let csvContent = "\uFEFF編號,收錄日期,報導類型,媒體名稱,報導標題,報導網址或報紙版位,記者名字,關鍵字\n";
            newsDatabase.forEach(item => {
                csvContent += `"${item.id}","${item.date}","${item.type}","${item.media}","${item.title}","${item.link}","${item.reporter}","${item.keywords}"\n`;
            });
            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `新聞資料庫_${document.getElementById('eventTheme').value || '未命名'}.csv`;
            link.click();
        }

        function importCSV(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const text = evt.target.result;
                const lines = text.split("\n");
                let loadedCount = 0;
                
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    // 簡易解析 CSV 欄位（處理雙引號）
                    const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
                    if (cols.length >= 6) {
                        newsDatabase.push({
                            id: currentId++,
                            date: cols[1] || "未填",
                            type: cols[2] || "網路",
                            media: cols[3] || "未填",
                            title: cols[4] || "未填",
                            link: cols[5] || "未填",
                            reporter: cols[6] || "未填",
                            keywords: cols[7] || ""
                        });
                        loadedCount++;
                    }
                }
                saveToLocalStorage(); renderDatabase(); updateCounters();
                alert(`成功從 Excel(CSV) 匯入 ${loadedCount} 筆報導！`);
            };
            reader.readAsText(file, "UTF-8");
        }

        // ================= 第二步與拖曳彈出視窗功能 =================
        let sortableInstance = null;

        function filterAndOpenSortModal() {
            const startId = parseInt(document.getElementById('startId').value);
            const endId = parseInt(document.getElementById('endId').value);
            const keyword = document.getElementById('filterKeyword').value.trim();

            if (newsDatabase.length === 0) return alert("資料庫是空的喔！");

            // 撈取要篩選的範圍
            filteredNewsResult = newsDatabase.filter(item => {
                const matchStart = !isNaN(startId) ? item.id >= startId : true;
                const matchEnd = !isNaN(endId) ? item.id <= endId : true;
                const matchKeyword = keyword !== "" ? item.keywords.includes(keyword) : true;
                return matchStart && matchEnd && matchKeyword;
            });

            if (filteredNewsResult.length === 0) return alert("沒有找到符合條件的新聞報導！");

            // 渲染彈出視窗清單
            const sortList = document.getElementById('sortableList');
            sortList.innerHTML = "";

            filteredNewsResult.forEach(item => {
                const li = document.createElement('li');
                li.className = "bg-white p-3 rounded-lg shadow-sm border border-gray-200 flex items-center justify-between cursor-move hover:border-indigo-400 transition";
                li.setAttribute('data-id', item.id);
                li.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-gray-400 font-bold text-xs">☰</span>
                        <span class="bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded text-[10px]">原序號 ${item.id}</span>
                        <span class="px-1.5 py-0.5 rounded text-[10px] ${getTypeClass(item.type)}">${item.type}</span>
                        <span class="font-bold text-xs text-indigo-900">${item.media}</span>
                        <span class="text-xs font-medium max-w-md truncate" title="${item.title}">${item.title}</span>
                    </div>
                    <div class="text-[11px] text-gray-400">${item.date}</div>
                `;
                sortList.appendChild(li);
            });

            // 啟動拖曳功能
            if (sortableInstance) sortableInstance.destroy();
            sortableInstance = new Sortable(sortList, { animation: 150 });

            document.getElementById('sortModal').classList.remove('hidden');
        }

        function closeSortModal() {
            document.getElementById('sortModal').classList.add('hidden');
        }

        // 儲存排序並匯出文字
        function saveSortAndExport() {
            // 讀取當前拖曳排完後的新順序
            const currentOrderIds = Array.from(document.getElementById('sortableList').children).map(li => parseInt(li.getAttribute('data-id')));
            
            // 重新排列資料
            const finalSortedData = currentOrderIds.map(id => newsDatabase.find(item => item.id === id));

            // 記錄到歷史紀錄
            const record = {
                timestamp: new Date().toLocaleString(),
                theme: document.getElementById('eventTheme').value || "未命名活動",
                count: finalSortedData.length,
                titles: finalSortedData.map(item => `[${item.media}] ${item.title}`)
            };
            exportHistory.unshift(record); // 最新放最前
            saveToLocalStorage();

            // 📢 呼叫生成文字格式方法 (先塞假動作，等您給我最終格式)
            generateTextOutput(finalSortedData);
        }

        // 生成最後文字並複製
        function generateTextOutput(dataList) {
            let theme = document.getElementById('eventTheme').value || "未命名活動";
            
            // 💡 這邊是給您的暫時格式，您可以測試看看。等等您把最終格式給我，我直接幫您換掉這段！
            let outputText = `【${theme}】成果回報\n`;
            outputText += `本次共收錄精選新聞 ${dataList.length} 則，排序如下：\n\n`;
            
            dataList.forEach((item, index) => {
                outputText += `${index + 1}. 【${item.media}】${item.title}\n`;
                outputText += `   - 類型：${item.type} | 記者：${item.reporter}\n`;
                outputText += `   - 連結/版位：${item.link}\n\n`;
            });

            // 複製到剪貼簿
            navigator.clipboard.writeText(outputText).then(() => {
                alert(`✨ 排序已儲存！\n精選的新聞內容已『自動複製到你的剪貼簿』，可以直接去 LINE 貼上 (Ctrl+V) 給主管囉！`);
                closeSortModal();
            }).catch(err => {
                alert("自動複製失敗，請手動複製產生的內容。");
            });
        }

        // 歷史紀錄彈出視窗控制
        function toggleHistoryModal() {
            const modal = document.getElementById('historyModal');
            if (modal.classList.contains('hidden')) {
                const container = document.getElementById('historyContainer');
                if (exportHistory.length === 0) {
                    container.innerHTML = `<p class="text-gray-400 text-center py-4">目前還沒有任何匯出紀錄喔。</p>`;
                } else {
                    container.innerHTML = exportHistory.map(h => `
                        <div class="bg-gray-50 p-2.5 rounded-lg border border-gray-200">
                            <div class="flex justify-between font-bold text-gray-700 mb-1">
                                <span>📌 ${h.theme} (${h.count}則)</span>
                                <span class="text-gray-400 font-normal">${h.timestamp}</span>
                            </div>
                            <ul class="list-disc list-inside text-gray-500 pl-1 space-y-0.5">
                                ${h.titles.slice(0, 3).map(t => `<li class="truncate">${t}</li>`).join('')}
                                ${h.titles.length > 3 ? `<li>...等其他 ${h.titles.length - 3} 篇報導</li>` : ''}
                            </ul>
                        </div>
                    `).join('');
                }
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
